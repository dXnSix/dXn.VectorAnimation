[package]
name = "dxn_vector_animation_cli"
description = "The vector-animation command: inspect, validate, compile and render animated SVG and Lottie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["animation", "svg", "lottie", "cli"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "vector-animation"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dxn_vector_animation = { workspace = true, features = ["serde"] }
dxn_vector_animation_lottie.workspace = true
dxn_vector_animation_render.workspace = true
dxn_vector_animation_svg.workspace = true
serde_json.workspace = true

[lints]
workspace = true
