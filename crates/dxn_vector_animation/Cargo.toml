[package]
name = "dxn_vector_animation"
description = "Animated vector graphics: one scene model for animated SVG and Lottie, sampled at any time or played by a native animation system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["animation", "svg", "lottie", "vector", "motion"]
