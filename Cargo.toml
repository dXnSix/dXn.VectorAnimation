[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dXnSix/dXn.VectorAnimation"
homepage = "https://github.com/dXnSix/dXn.VectorAnimation"

[workspace.dependencies]
dxn_vector_animation = { version = "0.1.0", path = "crates/dxn_vector_animation" }
dxn_vector_animation_svg = { version = "0.1.0", path = "crates/dxn_vector_animation_svg" }
dxn_vector_animation_lottie = { version = "0.1.0", path = "crates/dxn_vector_animation_lottie" }
dxn_vector_animation_render = { version = "0.1.0", path = "crates/dxn_vector_animation_render" }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
i_overlay = { version = "9.1.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
kurbo = { version = "0.13.1", default-features = false, features = ["std"] }
miniz_oxide = "0.8.9"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
svgtypes = "0.16.1"
thiserror = "2.0.21"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
