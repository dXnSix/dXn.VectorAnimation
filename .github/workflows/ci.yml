name: dXn.VectorAnimation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: core (fmt, clippy, test)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      # The core crates depend on no UI framework: none of them pulls in NSH.
      - name: The core depends on no NSH
        shell: bash
        run: |
          tree=$(cargo tree --workspace --exclude dxn_vector_animation_nsh --exclude dxn_vector_animation_check \
            --edges all --prefix none)
          if grep -E '^nsh-' <<< "$tree"; then
            echo "::error::A core crate depends on NSH."
            exit 1
          fi
      - run: cargo clippy --workspace --exclude dxn_vector_animation_nsh --exclude dxn_vector_animation_check --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo check -p dxn_vector_animation -p dxn_vector_animation_svg -p dxn_vector_animation_lottie -p dxn_vector_animation_rive --target wasm32-unknown-unknown

  nsh:
    name: NSH player (clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - run: cargo clippy -p dxn_vector_animation_nsh -p dxn_vector_animation_check --all-targets -- -D warnings
      - run: cargo test -p dxn_vector_animation_nsh -p dxn_vector_animation_check
